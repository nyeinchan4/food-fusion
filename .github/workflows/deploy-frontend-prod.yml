# .github/workflows/deploy-frontend-prod.yml
# Two-stage pipeline for the Nginx + Vite frontend:
#   build  — builds the Docker image and pushes to ECR
#   deploy — downloads the ECS task definition, renders the new image, and rolling-deploys
# Authentication uses OIDC (no long-lived AWS credentials).

name: Deploy Frontend [prod]

on:
  push:
    branches: [main]
    paths:
      - 'resources/**'
      - 'public/**'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile.frontend'
      - '.github/workflows/deploy-frontend-prod.yml'

  workflow_dispatch:

permissions:
  id-token: write   # Required for requesting the JWT
  contents: read    # Required for actions/checkout

env:
  AWS_REGION: ap-southeast-1
  ECR_REPO_NAME: food-fusion-frontend

# ══════════════════════════════════════════════════════════════════════════════
jobs:

  # ── Stage 1: Build & Push ──────────────────────────────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GitHubActionsDeployRoleArn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend image
        id: build-image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPO_NAME"

          echo "Building image: $IMAGE_URI:$IMAGE_TAG"
          docker build \
            -f Dockerfile.frontend \
            -t "$IMAGE_URI:$IMAGE_TAG" \
            -t "$IMAGE_URI:latest" \
            .

          docker push "$IMAGE_URI:$IMAGE_TAG"
          docker push "$IMAGE_URI:latest"

          echo "image=$IMAGE_URI:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  # ── Stage 2: Deploy to ECS ─────────────────────────────────────────────────
  deploy:
    name: Deploy to ECS [prod]
    runs-on: ubuntu-latest
    environment: prod
    needs: build

    env:
      ECS_CLUSTER: prod-food-fusion-ecs-cluster
      ECS_SERVICE: prod-food-fusion-frontend-svc
      ECS_TASK_DEF: prod-food-fusion-frontend-task
      CONTAINER_NAME: prod-food-fusion-frontend

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GitHubActionsDeployRoleArn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEF" \
            --query taskDefinition \
            --output json > task-def.json
          echo "Downloaded task definition: $ECS_TASK_DEF"

      - name: Render new task definition with updated image
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ needs.build.outputs.image }}

      - name: Deploy to Amazon ECS (rolling update)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
