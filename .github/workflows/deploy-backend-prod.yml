# .github/workflows/deploy-backend-prod.yml
# Two-stage pipeline for the Laravel PHP-FPM backend:
#   build  — builds the Docker image and pushes to ECR
#   deploy — deploys the new image to both the backend service and queue worker
# Authentication uses OIDC (no long-lived AWS credentials).

name: Deploy Backend [prod]

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'database/**'
      - 'routes/**'
      - 'storage/**'
      - 'composer.json'
      - 'composer.lock'
      - 'artisan'
      - 'Dockerfile.backend'
      - '.github/workflows/deploy-backend-prod.yml'

  workflow_dispatch:

permissions:
  id-token: write   # Required for requesting the JWT
  contents: read    # Required for actions/checkout

env:
  AWS_REGION: ap-southeast-1
  ECR_REPO_NAME: food-fusion-backend

# ══════════════════════════════════════════════════════════════════════════════
jobs:

  # ── Stage 1: Build & Push ──────────────────────────────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GitHubActionsDeployRoleArn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        id: build-image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPO_NAME"

          echo "Building image: $IMAGE_URI:$IMAGE_TAG"
          docker build \
            -f Dockerfile.backend \
            -t "$IMAGE_URI:$IMAGE_TAG" \
            -t "$IMAGE_URI:latest" \
            .

          docker push "$IMAGE_URI:$IMAGE_TAG"
          docker push "$IMAGE_URI:latest"

          echo "image=$IMAGE_URI:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  # ── Stage 2: Deploy to ECS ─────────────────────────────────────────────────
  deploy:
    name: Deploy to ECS [prod]
    runs-on: ubuntu-latest
    environment: prod
    needs: build

    env:
      ECS_CLUSTER: prod-food-fusion-ecs-cluster
      BACKEND_SERVICE: prod-food-fusion-backend-svc
      QUEUE_SERVICE: prod-food-fusion-queue-svc
      BACKEND_TASK_DEF: prod-food-fusion-backend-task
      QUEUE_TASK_DEF: prod-food-fusion-queue-task
      BACKEND_CONTAINER: prod-food-fusion-backend
      QUEUE_CONTAINER: prod-food-fusion-queue

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.GitHubActionsDeployRoleArn }}
          aws-region: ${{ env.AWS_REGION }}

      # ── Backend service ──────────────────────────────────────────────────────
      - name: Download backend task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$BACKEND_TASK_DEF" \
            --query taskDefinition \
            --output json > backend-task-def.json

      - name: Render backend task definition with updated image
        id: render-backend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: backend-task-def.json
          container-name: ${{ env.BACKEND_CONTAINER }}
          image: ${{ needs.build.outputs.image }}

      - name: Deploy backend service (rolling update)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-backend.outputs.task-definition }}
          service: ${{ env.BACKEND_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      # ── Queue worker (same image, separate service) ──────────────────────────
      - name: Download queue task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$QUEUE_TASK_DEF" \
            --query taskDefinition \
            --output json > queue-task-def.json

      - name: Render queue task definition with updated image
        id: render-queue
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: queue-task-def.json
          container-name: ${{ env.QUEUE_CONTAINER }}
          image: ${{ needs.build.outputs.image }}

      - name: Deploy queue worker (rolling update)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-queue.outputs.task-definition }}
          service: ${{ env.QUEUE_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
