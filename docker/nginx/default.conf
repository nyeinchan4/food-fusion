server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.php index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Static files caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|webp|avif|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Serve Laravel storage files (uploaded images, etc.) as static files
    # ^~ ensures this prefix match takes priority over regex locations below
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 1y;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri $uri/ =404;
    }

    # PHP-FPM proxy for Laravel backend
    # resolver 169.254.169.253 = Fargate link-local DNS, defers resolution to
    # request-time so Nginx starts even if backend isn't ready yet.
    # backend.food-fusion.local resolves via AWS Cloud Map service discovery.
    location ~ \.php$ {
        resolver 169.254.169.253 valid=10s ipv6=off;
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        set $backend_host "backend.food-fusion.local";
        fastcgi_pass $backend_host:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_buffering off;
    }

    # Laravel routes
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
